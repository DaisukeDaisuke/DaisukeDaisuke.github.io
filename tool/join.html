<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Minecraft Redirect</title>
</head>
<body>

<p>
「Minecraftを開く」を選択してください！<br>
Please select "Open Minecraft".
</p>

<script>
// クエリ取得
const params = new URLSearchParams(location.search);

// パラメータ取得（そのまま使う）
const serverUrl = params.get("serverUrl");
const serverPort = params.get("serverPort");

// 必須チェック
if (serverUrl && serverPort) {
    const url = "minecraft://connect/?serverUrl=" + serverUrl + "&serverPort=" + serverPort;

    // 1回目
    location.href = url;

    // フォールバック（少し遅らせて再試行）
    setTimeout(() => {
        location.href = url;
    }, 1500);

} else {
    document.body.innerText = "serverUrl と serverPort を指定してください";
}
</script>

</body>
</html>
